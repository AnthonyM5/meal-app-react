name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SECRET SCOPING POLICY
#
# Job-level `env:` is visible to EVERY process in EVERY step of that job —
# including `pnpm install`, `pnpm build`, and any transitive dependency's build
# script or bundler plugin that runs during them. A single compromised package
# anywhere in the tree could therefore read anything declared at job level.
#
# So: only the two NEXT_PUBLIC_* values live at job level. They are inlined into
# the client bundle by design and are already public, so exposure costs nothing.
#
# SUPABASE_SERVICE_ROLE_KEY (bypasses RLS; can read/write/delete any row) and
# GEMINI_API_KEY (metered spend) are declared on the SINGLE step that needs
# them, never at job level. Do not hoist them back up for convenience.
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build application
        run: pnpm build

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
  cypress:
    needs: test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Cypress downloads its ~200 MB binary to ~/.cache/Cypress during
      # `pnpm install` (approved in onlyBuiltDependencies). Restore it before
      # install so reruns skip the download.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          # Key on the web app's manifest (which pins the cypress version),
          # not the whole lockfile — an unrelated dep bump shouldn't force a
          # ~200 MB re-download. restore-keys lets a stale-but-usable binary
          # be restored; the explicit `cypress install` step reconciles it.
          key: cypress-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guarantee the Cypress binary is present. pnpm may skip cypress's
      # postinstall on a store cache hit (side-effects cache), so the binary
      # can be absent even though the npm package is installed. `cypress
      # install` is idempotent — a no-op when ~/.cache/Cypress is already
      # populated (restored above), a download otherwise.
      - name: Install Cypress binary
        run: pnpm --filter web exec cypress install

      # Build a PRODUCTION bundle so the e2e run serves pre-compiled routes.
      # `next dev` compiles each route on first request (a cold /dashboard took
      # ~17s in CI), which blows past Cypress's 10s assertion timeout and makes
      # the first test to hit a route flake. `next start` responds in ms.
      - name: Build web app
        run: pnpm --filter web build

      # Boots `next start` on :3000, waits for it, then runs `cypress run`
      # (bundled Electron, headless). The e2e specs create/delete throwaway
      # confirmed users against the live Supabase project.
      #
      # This is the ONLY step that gets the privileged secrets, and it needs
      # both: cypress.config.ts's auth tasks use the service role to create and
      # confirm throwaway users, and the `next start` server this boots reads
      # both at request time (/api/bowl/analyze 503s without GEMINI_API_KEY —
      # its guard runs before dog validation). Declared here rather than at job
      # level so `pnpm install`, `cypress install`, and `next build` — the steps
      # that execute third-party code — never see them. See the policy note at
      # the top of this file.
      - name: Run Cypress e2e tests
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm --filter web test:e2e:ci

      # NOTE: there is deliberately no automated cleanup step here.
      #
      # The specs delete their own throwaway pawplate.e2e.* users in after()
      # hooks. A run that dies before those hooks fire leaks users, which is
      # swept manually with:
      #
      #   pnpm --filter web test:e2e:cleanup            # dry run
      #   pnpm --filter web test:e2e:cleanup -- --delete
      #
      # Kept manual on purpose: the sweep needs the service-role key, and
      # adding an always() step to run it would put that key back in a step
      # that also runs on failure paths — the exact exposure the scoping above
      # exists to prevent.
